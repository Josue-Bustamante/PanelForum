<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Vista de proyector — Preguntas en tiempo real">
  <title>Proyeccion</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="Imagen/icon.png?v=2" type="image/png">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    /* ═══════════════════════════════════════════════════════════
       DISPLAY STYLES: ABSTRACT POSTER BACKGROUND & HIGH CONTRAST
       ═══════════════════════════════════════════════════════════ */
    body {
      background-color: var(--dark-950);
      cursor: none;
      color: var(--gold-100);
      overflow: hidden;
      margin: 0;
    }

    body:hover {
      cursor: default;
    }

    /* Fondo: Poster visible, alineado y oscurecido */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: url('Imagen/post.jpg') center -200px / cover no-repeat;
      /* Hacemos la imagen más opaca/oscura para que no distraiga */
      filter: brightness(0.25) contrast(0.9);
      opacity: 0.7;
      /* Lo funde ligeramente con el fondo negro */
      z-index: -1;
    }

    /* Ocultar elementos de fondo viejos */
    .bg-orb,
    .display-particles {
      display: none !important;
    }

    /* ── Contenedor Principal (Centrado) ── */
    .display-fullscreen {
      position: relative;
      z-index: 10;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      /* Vuelve a estar centrado */
      justify-content: center;
    }

    /* ── Acentos y branding centrados ── */
    .display-accent-line {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 5px;
      background: linear-gradient(90deg, transparent, var(--gold-500), var(--gold-400), var(--gold-500), transparent);
      z-index: 10;
      box-shadow: 0 0 15px var(--gold-500);
    }

    .display-brand {
      left: 50% !important;
      transform: translateX(-50%);
    }

    /* ── Question Card (Ultra legibilidad) ── */
    .display-question-container {
      position: relative;
      padding: var(--sp-12);
      border-radius: var(--radius-2xl);
      background: rgba(15, 13, 8, 0.85);
      /* Muy oscuro casi opaco */
      backdrop-filter: blur(15px);
      border: 3px solid var(--gold-400);
      /* Borde dorado */
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.8), 0 0 30px rgba(251, 191, 36, 0.2);
      max-width: 85vw;
      margin: 0 auto;
    }

    /* Texto de pregunta super claro */
    .display-question-text {
      color: #FFFFFF;
      text-shadow: 0 4px 12px rgba(0, 0, 0, 0.5);
    }

    /* ── QR Mode ── */
    .qr-wrapper {
      padding: var(--sp-6);
      background: white;
      border-radius: var(--radius-xl);
      border: 4px solid var(--gold-400);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8), 0 0 40px rgba(251, 191, 36, 0.4);
      display: inline-block;
      margin-bottom: var(--sp-8);
    }

    .display-qr-title {
      text-shadow: 0 4px 12px rgba(0, 0, 0, 0.8);
      color: #FFFFFF;
    }

    .display-qr-subtitle,
    .display-qr-url {
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8);
      font-weight: 700;
      color: #FFFFFF;
    }

    /* Hide display modes by default */
    .display-mode {
      display: none;
      width: 100%;
    }

    .display-mode.active {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
    }
  </style>
</head>

<body>
  <!-- Animated Background -->
  <div class="bg-animated">
    <div class="bg-orb bg-orb--1"></div>
    <div class="bg-orb bg-orb--2"></div>
    <div class="bg-orb bg-orb--3"></div>
  </div>

  <!-- Floating Particles -->
  <div class="display-particles" id="particles"></div>

  <!-- Top Accent Line -->
  <div class="display-accent-line"></div>

  <!-- ═══ Display Container ═══ -->
  <div class="display-fullscreen">

    <!-- QR Mode -->
    <div class="display-mode active" id="modeQR">
      <div class="display-qr">
        <h1 class="display-qr-title gradient-text">📱 Escanea para preguntar</h1>
        <div class="qr-wrapper" id="qrContainer">
          <!-- QR Generated Here -->
        </div>
        <p class="display-qr-subtitle">Envía tu pregunta de forma anónima</p>
      </div>
    </div>

    <!-- Question Mode -->
    <div class="display-mode" id="modeQuestion">
      <div class="display-question">
        <div class="display-question-container">
          <div class="display-question-text" id="questionText">
            <!-- Question text appears here -->
          </div>
        </div>
      </div>
    </div>

    <!-- Idle Mode -->
    <div class="display-mode" id="modeIdle">
      <div class="display-idle">
        <img src="Imagen/icon.png" alt="Huellas Logo" class="display-idle-logo">
        <p class="display-idle-text gradient-text">Esperando preguntas...</p>
      </div>
    </div>
  </div>

  <!-- Brand Footer -->
  <div class="display-brand">
    ✦ Panel Forum Q&A
  </div>

  <!-- Connection indicator (subtle) -->
  <div style="display: none; position: fixed; top: var(--sp-3); right: var(--sp-3); z-index: 100;">
    <div class="connection-status">
      <span class="connection-dot" id="connectionDot"></span>
    </div>
  </div>


  <!-- Firebase DB Client -->
  <script src="db.js"></script>

  <script>
    // ─── DOM ───────────────────────────────────────────
    const modeQR = document.getElementById('modeQR');
    const modeQuestion = document.getElementById('modeQuestion');
    const modeIdle = document.getElementById('modeIdle');
    const questionText = document.getElementById('questionText');
    const qrContainer = document.getElementById('qrContainer');
    const connectionDot = document.getElementById('connectionDot');
    const particlesContainer = document.getElementById('particles');

    // State cache
    let displayState = { mode: 'qr', activeQuestionId: null };
    let questions = {};

    // ─── Generate Particles ────────────────────────────
    function createParticles() {
      for (let i = 0; i < 30; i++) {
        const particle = document.createElement('div');
        particle.className = 'particle';
        particle.style.left = Math.random() * 100 + '%';
        particle.style.width = (Math.random() * 3 + 1) + 'px';
        particle.style.height = particle.style.width;
        particle.style.animationDuration = (Math.random() * 15 + 10) + 's';
        particle.style.animationDelay = (Math.random() * 15) + 's';
        particlesContainer.appendChild(particle);
      }
    }
    createParticles();

    // ─── Generate QR Code ──────────────────────────────
    function generateQR() {
      // Build audience url based on current browser window location
      let url = window.location.href;
      if (url.includes('display.html')) {
        url = url.replace('display.html', 'preguntar.html');
      } else {
        // Fallback for directory indexing or custom configurations
        const path = window.location.pathname;
        const newPath = path.substring(0, path.lastIndexOf('/')) + '/preguntar.html';
        url = window.location.origin + newPath;
      }

      // Clear previous QR
      qrContainer.innerHTML = '';

      new QRCode(qrContainer, {
        text: url,
        width: 280,
        height: 280,
        colorDark: '#1A1408',
        colorLight: '#FFFFFF',
        correctLevel: QRCode.CorrectLevel.H
      });
    }

    generateQR();

    // ─── Realtime Subscriptions ─────────────────────────

    // 1. Listen to questions first (so we have a cache)
    DB.listen('questions', (data) => {
      questions = data || {};
      updateDisplay();
    });

    // 2. Listen to displayState (and monitor connection)
    DB.listen('displayState', (data) => {
      displayState = data || { mode: 'qr', activeQuestionId: null };
      updateDisplay();
    }, (isOpen) => {
      if (isOpen) {
        connectionDot.className = 'connection-dot connected';
      } else {
        connectionDot.className = 'connection-dot disconnected';
      }
    });

    // ─── Display Update ────────────────────────────────
    function updateDisplay() {
      const mode = displayState.mode || 'qr';

      // Hide all
      modeQR.classList.remove('active');
      modeQuestion.classList.remove('active');
      modeIdle.classList.remove('active');

      switch (mode) {
        case 'qr':
          modeQR.classList.add('active');
          break;

        case 'question':
          const activeId = displayState.activeQuestionId;
          const activeQ = questions[activeId];
          if (activeQ) {
            // Check if text is different before triggering transition animations
            if (questionText.textContent !== activeQ.text) {
              questionText.textContent = activeQ.text;

              // Re-trigger animation
              modeQuestion.style.animation = 'none';
              modeQuestion.offsetHeight;
              modeQuestion.style.animation = '';

              const container = modeQuestion.querySelector('.display-question-container');
              container.style.animation = 'none';
              container.offsetHeight;
              container.style.animation = 'questionReveal 0.8s var(--ease-out)';
            }
          } else {
            // If the active question is not loaded yet or deleted
            questionText.textContent = "Cargando pregunta...";
          }
          modeQuestion.classList.add('active');
          break;

        case 'idle':
        default:
          modeIdle.classList.add('active');
          break;
      }
    }

    // ─── Keyboard Controls ─────────────────────────────
    document.addEventListener('keydown', (e) => {
      // F11 or F for fullscreen
      if (e.key === 'f' || e.key === 'F') {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().catch(() => { });
        } else {
          document.exitFullscreen().catch(() => { });
        }
      }

      // Escape to exit fullscreen
      if (e.key === 'Escape' && document.fullscreenElement) {
        document.exitFullscreen().catch(() => { });
      }
    });
  </script>
</body>

</html>
