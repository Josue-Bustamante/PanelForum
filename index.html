<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Panel de moderación — Revisa y aprueba preguntas">
  <title>Moderador — Panel Forum</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Animated Background -->
  <div class="bg-animated">
    <div class="bg-orb bg-orb--1"></div>
    <div class="bg-orb bg-orb--2"></div>
  </div>

  <div class="app-container admin-layout">
    
    <!-- ─── Header ──────────────────────────────────── -->
    <header class="admin-header">
      <div class="admin-header-inner">
        <div class="admin-brand">
          <div class="admin-brand-icon">🛡️</div>
          <span class="admin-brand-text">Panel de Moderación</span>
          <div class="connection-status" id="connectionStatus">
            <span class="connection-dot" id="connectionDot"></span>
            <span id="connectionText">Conectando...</span>
          </div>
        </div>
        <div class="admin-actions">
          <span style="color: var(--text-muted); font-size: 0.9rem; margin-right: var(--sp-4); display: flex; align-items: center;">
            Total recibidas: <strong id="statTotal" style="color: var(--text-light); margin-left: var(--sp-2);">0</strong>
          </span>
          <a href="display.html" target="_blank" class="btn btn-primary btn-sm" title="Abrir proyector en nueva pestaña">
            🖥️ Abrir Proyector
          </a>
          <button class="btn btn-ghost btn-sm" id="showQrBtn" title="Mostrar QR en proyector">
            📱 Mostrar QR
          </button>
          <button class="btn btn-ghost btn-sm" id="clearDisplayBtn" title="Limpiar proyector">
            📺 Limpiar Display
          </button>
          <button class="btn btn-danger btn-sm" id="clearAllBtn" title="Borrar todas las preguntas">
            🗑️ Borrar todo
          </button>
        </div>
      </div>
    </header>

    <!-- ─── Stats ───────────────────────────────────── -->
    <div class="stats-bar">
      <div class="glass-card stat-card">
        <div class="stat-number gold" id="statPending">0</div>
        <div class="stat-label">Pendientes</div>
      </div>
      <div class="glass-card stat-card">
        <div class="stat-number green" id="statApproved">0</div>
        <div class="stat-label">Aprobadas</div>
      </div>
      <div class="glass-card stat-card">
        <div class="stat-number purple" id="statShown" style="color: #a78bfa; text-shadow: 0 0 15px rgba(167,139,250,0.4);">0</div>
        <div class="stat-label">Mostradas</div>
      </div>
      <div class="glass-card stat-card">
        <div class="stat-number red" id="statRejected">0</div>
        <div class="stat-label">Rechazadas</div>
      </div>
    </div>

    <!-- ─── Filters ─────────────────────────────────── -->
    <div class="filter-tabs">
      <button class="filter-tab active" data-filter="pending" id="filterPending">
        ⏳ Pendientes <span class="count" id="countPending">0</span>
      </button>
      <button class="filter-tab" data-filter="approved" id="filterApproved">
        ✅ Aprobadas <span class="count" id="countApproved">0</span>
      </button>
      <button class="filter-tab" data-filter="shown" id="filterShown">
        📺 Mostradas <span class="count" id="countShown">0</span>
      </button>
      <button class="filter-tab" data-filter="rejected" id="filterRejected">
        ❌ Rechazadas <span class="count" id="countRejected">0</span>
      </button>
    </div>

    <!-- ─── Questions ───────────────────────────────── -->
    <div class="questions-container">
      <div class="questions-grid" id="questionsGrid">
        <!-- Questions rendered here -->
      </div>
      
      <div class="empty-state" id="emptyState">
        <div class="empty-icon">📭</div>
        <div class="empty-title">Sin preguntas aún</div>
        <p class="empty-text">Las preguntas de la audiencia aparecerán aquí</p>
      </div>
    </div>
  </div>

  <!-- Toast Container -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- Firebase DB Client -->
  <script src="db.js"></script>

  <script>
    // ─── State ─────────────────────────────────────────
    let questions = {}; // Realtime object from Firebase { '-Nxxxxxx': { text, timestamp, status } }
    let displayState = { mode: 'qr', activeQuestionId: null };
    let currentFilter = 'pending';
    let isInitialLoad = true;
    let knownKeys = new Set();

    // ─── DOM ───────────────────────────────────────────
    const questionsGrid = document.getElementById('questionsGrid');
    const emptyState = document.getElementById('emptyState');
    const connectionDot = document.getElementById('connectionDot');
    const connectionText = document.getElementById('connectionText');
    const toastContainer = document.getElementById('toastContainer');

    // Stats
    const statTotal = document.getElementById('statTotal');
    const statPending = document.getElementById('statPending');
    const statApproved = document.getElementById('statApproved');
    const statRejected = document.getElementById('statRejected');

    // Counts in filters
    const countPending = document.getElementById('countPending');
    const countApproved = document.getElementById('countApproved');
    const countRejected = document.getElementById('countRejected');

    // Buttons
    const showQrBtn = document.getElementById('showQrBtn');
    const clearDisplayBtn = document.getElementById('clearDisplayBtn');
    const clearAllBtn = document.getElementById('clearAllBtn');

    // ─── Realtime Subscriptions ─────────────────────────
    
    // 1. Listen to displayState (and monitor connection)
    DB.listen('displayState', (data) => {
      if (data) {
        displayState = data;
      } else {
        displayState = { mode: 'qr', activeQuestionId: null };
      }
      render();
    }, (isOpen) => {
      if (isOpen) {
        connectionDot.className = 'connection-dot connected';
        connectionText.textContent = 'Conectado';
      } else {
        connectionDot.className = 'connection-dot disconnected';
        connectionText.textContent = 'Desconectado';
      }
    });

    // 3. Listen to questions
    DB.listen('questions', (data) => {
      questions = data || {};
      
      // Handle notifications for new questions
      const currentKeys = Object.keys(questions);
      if (!isInitialLoad) {
        currentKeys.forEach(key => {
          if (!knownKeys.has(key)) {
            const q = questions[key];
            if (q.status === 'pending') {
              showToast(`Nueva pregunta recibida: "${q.text.substring(0, 50)}${q.text.length > 50 ? '...' : ''}"`, '🔔');
              playNotificationSound();
            }
          }
        });
      } else {
        isInitialLoad = false;
      }
      
      knownKeys = new Set(currentKeys);
      render();
    });

    // ─── Render ────────────────────────────────────────
    function render() {
      const qList = getQuestionsList();
      updateStats(qList);
      updateCounts(qList);
      renderQuestions(qList);
    }

    function getQuestionsList() {
      return Object.keys(questions).map(key => ({
        id: key,
        ...questions[key]
      }));
    }

    function updateStats(qList) {
      statTotal.textContent = qList.length;
      statPending.textContent = qList.filter(q => q.status === 'pending').length;
      statApproved.textContent = qList.filter(q => q.status === 'approved').length;
      document.getElementById('statShown').textContent = qList.filter(q => q.status === 'shown').length;
      statRejected.textContent = qList.filter(q => q.status === 'rejected').length;
    }

    function updateCounts(qList) {
      countPending.textContent = qList.filter(q => q.status === 'pending').length;
      countApproved.textContent = qList.filter(q => q.status === 'approved').length;
      document.getElementById('countShown').textContent = qList.filter(q => q.status === 'shown').length;
      countRejected.textContent = qList.filter(q => q.status === 'rejected').length;
    }

    function renderQuestions(qList) {
      const filtered = currentFilter === 'all' 
        ? qList 
        : qList.filter(q => q.status === currentFilter);

      // Sort: pending first, then newest
      filtered.sort((a, b) => {
        const statusOrder = { pending: 0, approved: 1, shown: 2, rejected: 3 };
        if (statusOrder[a.status] !== statusOrder[b.status]) {
          return statusOrder[a.status] - statusOrder[b.status];
        }
        return new Date(b.timestamp) - new Date(a.timestamp);
      });

      if (filtered.length === 0) {
        questionsGrid.innerHTML = '';
        emptyState.classList.remove('hidden');
        return;
      }

      emptyState.classList.add('hidden');
      questionsGrid.innerHTML = filtered.map(q => createQuestionCard(q)).join('');

      // Bind events
      questionsGrid.querySelectorAll('[data-action]').forEach(btn => {
        btn.addEventListener('click', handleAction);
      });
    }

    function createQuestionCard(q) {
      const time = new Date(q.timestamp).toLocaleTimeString('es', { 
        hour: '2-digit', 
        minute: '2-digit' 
      });
      
      const isActive = displayState.mode === 'question' && displayState.activeQuestionId === q.id;
      const badgeClass = `badge-${q.status}`;
      const statusLabels = {
        pending: '⏳ Pendiente',
        approved: '✅ Aprobada',
        shown: '📺 Mostrada',
        rejected: '❌ Rechazada'
      };

      let actions = '';
      
      if (q.status === 'pending') {
        actions = `
          <button class="btn btn-success btn-sm" data-action="approve" data-id="${q.id}">
            ✅ Aprobar
          </button>
          <button class="btn btn-danger btn-sm" data-action="reject" data-id="${q.id}">
            ❌ Rechazar
          </button>
        `;
      } else if (q.status === 'approved' || q.status === 'shown') {
        actions = `
          <button class="btn btn-primary btn-sm ${isActive ? 'active-display-btn' : ''}" 
                  data-action="show" data-id="${q.id}"
                  ${isActive ? 'disabled' : ''}>
            📺 ${isActive ? 'En pantalla' : 'Mostrar'}
          </button>
        `;
      }

      actions += `
        <button class="btn btn-ghost btn-sm btn-icon" data-action="delete" data-id="${q.id}" title="Eliminar">
          🗑️
        </button>
      `;

      // Visual numeric indicator from key or time
      const displayId = q.id.substring(1, 5).toUpperCase();

      return `
        <div class="glass-card question-card ${isActive ? 'active-on-display' : ''}">
          <div class="question-top">
            <div class="question-meta">
              <span class="badge ${badgeClass}">${statusLabels[q.status]}</span>
              <span class="question-time">🕐 ${time}</span>
              ${isActive ? '<span class="badge badge-approved" style="animation: pulse 2s infinite;">📺 EN PANTALLA</span>' : ''}
            </div>
            <span class="question-id">#${displayId}</span>
          </div>
          <div class="question-text">${escapeHtml(q.text)}</div>
          <div class="question-actions">${actions}</div>
        </div>
      `;
    }

    // ─── Actions ───────────────────────────────────────
    async function handleAction(e) {
      const btn = e.currentTarget;
      const action = btn.dataset.action;
      const id = btn.dataset.id;

      try {
        switch (action) {
          case 'approve':
            await DB.update(`questions/${id}`, { status: 'approved' });
            showToast('Pregunta aprobada', '✅');
            break;
          case 'reject':
            await DB.update(`questions/${id}`, { status: 'rejected' });
            showToast('Pregunta rechazada', '❌');
            break;
          case 'show':
            await DB.update(`questions/${id}`, { status: 'shown' });
            await DB.set('displayState', { mode: 'question', activeQuestionId: id });
            showToast('Mostrando en pantalla', '📺');
            break;
          case 'delete':
            if (confirm('¿Eliminar esta pregunta?')) {
              await DB.remove(`questions/${id}`);
              if (displayState.mode === 'question' && displayState.activeQuestionId === id) {
                await DB.set('displayState', { mode: 'idle', activeQuestionId: null });
              }
              showToast('Pregunta eliminada', '🗑️');
            }
            break;
        }
      } catch (err) {
        console.error(err);
        showToast('Error al realizar la acción', '⚠️');
      }
    }

    // ─── Header Actions ────────────────────────────────
    showQrBtn.addEventListener('click', async () => {
      try {
        await DB.set('displayState', { mode: 'qr', activeQuestionId: null });
        showToast('QR visible en proyector', '📱');
      } catch (err) {
        showToast('Error al cambiar de modo', '⚠️');
      }
    });

    clearDisplayBtn.addEventListener('click', async () => {
      try {
        await DB.set('displayState', { mode: 'idle', activeQuestionId: null });
        showToast('Proyector limpiado', '📺');
      } catch (err) {
        showToast('Error al limpiar pantalla', '⚠️');
      }
    });

    clearAllBtn.addEventListener('click', async () => {
      if (confirm('¿Borrar TODAS las preguntas? Esta acción no se puede deshacer.')) {
        try {
          await DB.remove('questions');
          await DB.set('displayState', { mode: 'qr', activeQuestionId: null });
          showToast('Todas las preguntas eliminadas', '🗑️');
        } catch (err) {
          showToast('Error al borrar preguntas', '⚠️');
        }
      }
    });

    // ─── Filter Tabs ───────────────────────────────────
    document.querySelectorAll('.filter-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        currentFilter = tab.dataset.filter;
        render();
      });
    });

    // ─── Notification Sound ────────────────────────────
    function playNotificationSound() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        
        // First note
        const osc1 = ctx.createOscillator();
        const gain1 = ctx.createGain();
        osc1.connect(gain1);
        gain1.connect(ctx.destination);
        osc1.frequency.setValueAtTime(587.33, ctx.currentTime); // D5
        osc1.type = 'sine';
        gain1.gain.setValueAtTime(0.15, ctx.currentTime);
        gain1.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
        osc1.start(ctx.currentTime);
        osc1.stop(ctx.currentTime + 0.3);

        // Second note
        const osc2 = ctx.createOscillator();
        const gain2 = ctx.createGain();
        osc2.connect(gain2);
        gain2.connect(ctx.destination);
        osc2.frequency.setValueAtTime(880, ctx.currentTime + 0.15); // A5
        osc2.type = 'sine';
        gain2.gain.setValueAtTime(0, ctx.currentTime);
        gain2.gain.setValueAtTime(0.15, ctx.currentTime + 0.15);
        gain2.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.5);
        osc2.start(ctx.currentTime + 0.15);
        osc2.stop(ctx.currentTime + 0.5);
      } catch (e) {
        // Audio not available
      }
    }

    // ─── Utilities ─────────────────────────────────────
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function showToast(message, icon = '✦') {
      const toast = document.createElement('div');
      toast.className = 'toast';
      toast.innerHTML = `<span>${icon}</span> ${message}`;
      toastContainer.appendChild(toast);

      setTimeout(() => {
        toast.classList.add('toast-out');
        setTimeout(() => toast.remove(), 300);
      }, 3000);
    }
  </script>
</body>
</html>
